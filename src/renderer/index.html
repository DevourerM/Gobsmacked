<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' gob-media:; media-src 'self' gob-media: blob:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'self'">
  <title>Gobsmacked</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>

  <section id="auth-screen" class="auth-screen">
    <button id="language-toggle-auth" class="language-toggle auth-language" type="button">EN</button>
    <div class="auth-orbit" aria-hidden="true"><i></i><i></i><i></i></div>
    <form id="auth-form" class="glass auth-card">
      <h1>Gobsmacked</h1>
      <label class="field" aria-label="识别名称">
        <input id="identity-input" maxlength="50" autocomplete="username" placeholder="识别名称" data-i18n-placeholder="identity" required>
      </label>
      <label id="auth-secret-field" class="field" aria-label="密钥">
        <input id="secret-input" type="password" minlength="4" autocomplete="current-password" placeholder="密钥" data-i18n-placeholder="secret" required>
      </label>
      <p id="auth-error" class="form-error" role="alert"></p>
      <button class="primary wide" type="submit" data-i18n="enter">进入</button>
    </form>
  </section>

  <div id="app" class="app hidden">
    <div id="sky-pull-handle" class="sky-pull-handle" aria-label="向下拖拽打开天幕"><i></i></div>
    <header class="topbar glass">
      <div class="brand"><span class="brand-star">✦</span><div><strong>Gobsmacked</strong><small data-i18n="archiveSubtitle">LIFE ARCHIVE</small></div></div>
      <div class="mode-switch" role="group" aria-label="记录类型">
        <button class="active" data-mode="day" data-i18n="todayMode">今日记录</button>
        <button data-mode="year" data-i18n="yearMode">年度总结</button>
      </div>
      <div class="record-heading">
        <strong id="header-date"></strong>
        <span id="save-state" class="save-state" data-i18n="saved">已保存</span>
      </div>
      <div class="top-actions">
        <button class="language-toggle" type="button">EN</button>
        <button id="trust-device" class="trust-toggle" type="button" aria-pressed="false" data-i18n="trustDevice">信任</button>
        <button id="history-button" class="primary" data-i18n="pastArchive">历史记录</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="left-column">
        <section class="glass panel calendar-panel">
          <div class="panel-heading"><div><p class="eyebrow" data-i18n="calendar">日历</p><h2 id="calendar-title"></h2></div><div class="icon-actions"><button id="annotate-button" aria-label="添加日期标注">＋</button><button id="prev-month" aria-label="上个月">‹</button><button id="next-month" aria-label="下个月">›</button></div></div>
          <div class="weekdays"><span data-weekday="1">一</span><span data-weekday="2">二</span><span data-weekday="3">三</span><span data-weekday="4">四</span><span data-weekday="5">五</span><span data-weekday="6">六</span><span data-weekday="0">日</span></div>
          <div id="calendar-grid" class="calendar-grid"></div>
        </section>
      </aside>

      <section class="glass editor-shell">
        <div class="editor-meta">
          <input id="record-title" class="title-input" maxlength="200" aria-label="记录标题">
          <div class="tag-row"><div id="tags" class="tags"></div><form id="tag-form"><input id="tag-input" maxlength="40" placeholder="＋ 添加标签" data-i18n-placeholder="addTag" aria-label="添加标签"></form></div>
        </div>
        <div id="editor-blocks" class="editor-blocks"></div>
        <div class="insert-bar">
          <span data-i18n="addContent">添加内容</span>
          <button id="add-paragraph" class="secondary" data-i18n="textBlock">¶ 文本</button>
          <button id="add-image" class="secondary" data-i18n="image">▧ 图片</button>
          <button id="add-audio" class="secondary" data-i18n="recordAudio">● 录音</button>
        </div>
      </section>

      <aside class="right-column">
        <section class="glass panel earth-panel">
          <div class="panel-heading"><div><p class="eyebrow" data-i18n="environment">环境</p><h2 data-i18n="currentLocation">当前位置</h2></div><button id="clear-location" class="location-clear" aria-label="清除地点">×</button></div>
          <div class="earth-wrap"><canvas id="earth" width="300" height="300" aria-label="可交互的全息地球"></canvas><span class="scan-line"></span></div>
          <div class="location-footer"><p id="location-name" class="location-name" data-i18n="noLocation">尚未记录地点</p><button id="set-location" class="location-edit" aria-label="设置地点">＋</button></div>
        </section>
        <section class="glass panel day-note">
          <p class="eyebrow" data-i18n="todaySummary">今日概览</p>
          <div class="trace-stat"><span data-i18n="textCount">文字数</span><strong id="word-count">0</strong></div>
          <div class="trace-stat"><span data-i18n="mediaCount">媒体数</span><strong id="media-count">0</strong></div>
        </section>
      </aside>
    </main>
  </div>

  <section id="sky" class="sky" aria-hidden="true">
    <canvas id="sky-cosmos" class="sky-cosmos" aria-hidden="true"></canvas>
    <div class="sky-content">
      <button id="close-sky" class="sky-close" aria-label="收起天幕"></button>
      <div id="constellation" class="constellation"><svg id="constellation-lines" viewBox="0 0 100 100" aria-hidden="true"></svg></div>
    </div>
  </section>

  <section id="history-gate" class="overlay hidden" role="dialog" aria-modal="true">
    <form id="inner-auth-form" class="glass modal-card compact">
      <button type="button" class="modal-close" data-close="history-gate">×</button>
      <p class="eyebrow" data-i18n="protectedArchive">独立保护</p><h2 id="inner-auth-title" data-i18n="verifyPast">验证访问</h2>
      <label class="field"><span id="inner-secret-label" data-i18n="historySecret">历史密钥</span><input id="inner-secret" type="password" minlength="4" required autocomplete="current-password"></label>
      <p id="inner-error" class="form-error"></p>
      <button id="inner-auth-submit" type="submit" class="primary wide" data-i18n="verify">验证</button>
    </form>
  </section>

  <section id="history" class="history hidden" aria-hidden="true">
    <canvas id="history-cosmos" class="history-cosmos" aria-hidden="true"></canvas>
    <header class="history-header glass"><div><p class="eyebrow" data-i18n="archive">档案</p><h1 data-i18n="archiveReview">历史记录</h1></div><div class="archive-view-switch" role="tablist"><button id="archive-records-mode" class="active" type="button" role="tab" aria-selected="true" data-i18n="recordArchive">记录</button><button id="archive-library-mode" type="button" role="tab" aria-selected="false" data-i18n="fileArchive">资料</button></div><div class="top-actions history-actions"><button class="language-toggle" type="button">EN</button><button id="import-legacy" class="secondary" data-i18n="importLegacy">导入旧记录</button><button id="export-content" class="secondary" data-i18n="exportContent">导出内容</button><button id="export-migration" class="secondary" data-i18n="exportMigration">迁移备份</button><button id="close-history" class="ghost" data-i18n="returnPresent">返回今天</button></div></header>
    <div id="export-progress" class="export-progress hidden" role="status"><span id="export-progress-label"></span><i><b id="export-progress-bar"></b></i><em id="export-progress-percent">0%</em></div>
    <main class="history-main">
      <div id="history-records-view" class="history-records-view">
        <section class="glass year-timeline-panel">
          <div class="timeline-date"><p class="eyebrow" data-i18n="yearScale">年份</p><h2 id="timeline-date"></h2></div>
          <div class="year-chronology-shell"><div id="year-chronology" class="year-chronology" tabindex="0" aria-label="年份刻度"><canvas id="year-scale-canvas" class="year-scale-canvas" aria-hidden="true"></canvas></div><div class="year-timeline-cursor" aria-hidden="true"><i></i></div></div>
        </section>
        <section class="glass month-timeline-panel">
          <p class="eyebrow month-scale-title" data-i18n="dayScale">月份 / 记录日</p>
          <div class="chronology-shell"><div id="chronology" class="chronology" tabindex="0" aria-label="历史时轨"><canvas id="timeline-scale-canvas" class="timeline-scale-canvas" aria-hidden="true"></canvas></div><div id="timeline-cursor" class="timeline-cursor" aria-hidden="true"><i></i></div></div>
          <div class="timeline-legend"><span id="day-scale-legend"><i class="minor-sample"></i><span data-i18n="dayScale">月份 / 记录日</span></span><em data-i18n="dragChronology">拖动刻度</em></div>
        </section>
        <article id="history-preview" class="glass history-preview"></article>
      </div>
      <section id="library-view" class="glass library-view hidden">
        <header class="library-toolbar">
          <div class="library-heading"><p class="eyebrow" data-i18n="fileArchive">资料</p><div id="library-breadcrumb" class="library-breadcrumb"></div></div>
          <div class="library-actions"><button id="library-back" class="ghost" type="button" aria-label="返回上级">←</button><input id="library-filter" type="search" maxlength="80" placeholder="筛选当前目录" data-i18n-placeholder="filterFiles"><button id="library-import-files" class="secondary" type="button" data-i18n="importFiles">导入文件</button><button id="library-import-folder" class="secondary" type="button" data-i18n="importFolder">导入文件夹</button></div>
        </header>
        <div id="library-list" class="library-list" role="listbox" aria-label="资料文件"></div>
        <footer class="library-footer"><span id="library-status"></span><div><button id="library-open" class="secondary" type="button" disabled data-i18n="openFile">打开</button><button id="library-export" class="primary" type="button" disabled data-i18n="extractFile">提取</button></div></footer>
      </section>
    </main>
  </section>

  <section id="annotation-modal" class="overlay hidden" role="dialog" aria-modal="true">
    <form id="annotation-form" class="glass modal-card">
      <button type="button" class="modal-close" data-close="annotation-modal">×</button>
      <p class="eyebrow" data-i18n="calendarMark">日期标注</p><h2 id="annotation-date-title">日期标注</h2>
      <label class="field"><span data-i18n="markContent">标注内容</span><input id="annotation-text" maxlength="300" required placeholder="纪念日、约定或事件" data-i18n-placeholder="markPlaceholder"></label>
      <fieldset><legend data-i18n="displayScope">显示范围</legend><label class="radio-card"><input type="radio" name="scope" value="once" checked><span><b data-i18n="once">仅此日期</b><small data-i18n="onceDesc">只在这一年的这一天显示</small></span></label><label class="radio-card"><input type="radio" name="scope" value="annual"><span><b data-i18n="annual">每年重复</b><small data-i18n="annualDesc">每年的同一日期显示</small></span></label></fieldset>
      <div id="annotation-list" class="annotation-list"></div>
      <button type="submit" class="primary wide" data-i18n="saveMark">保存标注</button>
    </form>
  </section>

  <section id="location-modal" class="overlay hidden" role="dialog" aria-modal="true">
    <form id="location-form" class="glass modal-card compact">
      <button type="button" class="modal-close" data-close="location-modal">×</button>
      <h2 data-i18n="place">地点</h2>
      <label class="field"><input id="location-input" maxlength="100" required placeholder="地点名称或地址" data-i18n-placeholder="placePlaceholder" aria-label="地点"></label>
      <div class="location-actions"><button id="save-location-text" type="button" class="secondary" data-i18n="saveAddress">保存</button><button id="geocode-location" type="submit" class="primary" data-i18n="locateSave">定位</button></div>
    </form>
  </section>

  <section id="recording-modal" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="glass modal-card compact recording-card">
      <button id="cancel-recording" type="button" class="modal-close">×</button>
      <p class="eyebrow" data-i18n="voiceRecord">录音</p><h2 id="recording-title" data-i18n="recording">正在录音</h2>
      <div id="recording-orb" class="recording-orb"><i></i></div>
      <strong id="recording-time">00:00</strong>
      <p id="recording-status" class="muted" data-i18n="recordingActive">麦克风正在记录</p>
      <label id="recording-label-field" class="field recording-label hidden"><span data-i18n="voiceLabel">录音标签</span><input id="recording-label" maxlength="40" placeholder="例如：雨声" data-i18n-placeholder="voiceLabelPlaceholder"></label>
      <audio id="recording-preview" class="hidden"></audio>
      <div id="recording-preview-dial" class="audio-dial preview-dial hidden">
        <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="audio-ring-track" cx="50" cy="50" r="46"></circle><circle id="recording-preview-progress" class="audio-ring-progress" cx="50" cy="50" r="46" pathLength="100"></circle></svg>
        <button id="preview-recording" type="button" class="audio-dial-button" aria-label="试听录音">▶</button>
      </div>
      <div id="recording-preview-time" class="audio-dial-time hidden"><span id="recording-preview-current">00:00</span><i>/</i><span id="recording-preview-duration">00:00</span></div>
      <div class="recording-actions"><button id="stop-recording" type="button" class="secondary" data-i18n="stopRecording">停止</button><button id="use-recording" type="button" class="primary" data-i18n="insertRecording" disabled>插入记录</button></div>
    </div>
  </section>

  <div id="voice-player-popover" class="media-popover voice-popover hidden" role="dialog" aria-label="录音播放">
    <button id="close-voice-player" type="button" class="popover-close" aria-label="关闭">×</button>
    <strong id="voice-player-label"></strong>
    <audio id="voice-player-audio" class="hidden"></audio>
    <div id="voice-player-dial" class="audio-dial player-dial">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="audio-ring-track" cx="50" cy="50" r="46"></circle><circle id="voice-player-progress" class="audio-ring-progress" cx="50" cy="50" r="46" pathLength="100"></circle></svg>
      <button id="voice-player-toggle" type="button" class="audio-dial-button" aria-label="播放">▶</button>
    </div>
    <div class="audio-dial-time"><span id="voice-player-current">00:00</span><i>/</i><span id="voice-player-duration">00:00</span></div>
  </div>

  <div id="image-popover" class="media-popover image-popover hidden" role="dialog" aria-label="图片预览">
    <button id="close-image-popover" type="button" class="popover-close" aria-label="关闭">×</button>
    <strong id="image-popover-label"></strong>
    <button id="image-popover-open" class="image-popover-open" type="button" aria-label="查看大图"><img id="image-popover-preview" alt="图片预览"></button>
  </div>

  <form id="image-label-popover" class="media-popover image-label-popover hidden">
    <button id="cancel-image-label" type="button" class="popover-close" aria-label="关闭">×</button>
    <label class="field"><span data-i18n="imageLabel">图片标签</span><input id="image-label-input" maxlength="40" required placeholder="例如：星空" data-i18n-placeholder="imageLabelPlaceholder"></label>
    <button type="submit" class="primary wide" data-i18n="insertImageTag">插入标签</button>
  </form>

  <section id="image-modal" class="image-modal hidden" aria-label="图片预览"><button class="modal-close" data-close="image-modal">×</button><img id="image-preview" alt="记录图片放大预览"></section>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
